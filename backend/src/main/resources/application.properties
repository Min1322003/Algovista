spring.application.name=algovista-backend
server.port=8080

# Load the same .env Docker Compose uses (cwd is usually backend/ or the repo root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database (POSTGRES_* come from .env; defaults are only a last resort)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:algovista}
spring.datasource.username=${POSTGRES_USER:algovista}
spring.datasource.password=${POSTGRES_PASSWORD:algovista}

# JPA: Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS (frontend dev server)
app.cors.allowed-origins=http://localhost:5173
